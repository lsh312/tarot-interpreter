name: tarot-interpreter
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - pip
  - numpy
  - pandas
  - matplotlib
  - seaborn
  - pip:
      # API
      - fastapi==0.115.0
      - uvicorn[standard]==0.30.6
      - pydantic==2.8.2
      - python-dotenv==1.0.1
      - pyyaml==6.0.2

      # LLM & RAG
      - anthropic==0.34.0
      - langchain==0.3.0
      - langchain-anthropic==0.2.0
      - langchain-community==0.3.0
      - langchain-chroma==0.1.4
      - chromadb==0.5.3
      - sentence-transformers==3.1.1

      # Data & utilities
      - requests==2.32.3
      - tqdm==4.66.5

      # Notebooks
      - jupyter==1.1.1
      - ipykernel==6.29.5
      - ipywidgets==8.1.5

      # Testing
      - pytest==8.3.3
      - pytest-asyncio==0.24.0
      - httpx==0.27.2
